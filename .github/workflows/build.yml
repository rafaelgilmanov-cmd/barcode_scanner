name: Build APK
on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Extract version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - name: Rename APK with version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/BarcodeScanner-v${{ steps.version.outputs.VERSION }}.apk
      - name: Upload APK as Artifact
        if: startsWith(github.ref, 'refs/heads/')
        uses: actions/upload-artifact@v4
        with:
          name: App-APK
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Upload APK to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "BarcodeScanner v${{ steps.version.outputs.VERSION }}"
          files: build/app/outputs/flutter-apk/BarcodeScanner-v${{ steps.version.outputs.VERSION }}.apk
          generate_release_notes: true
          body: |
            ## BarcodeScanner v${{ steps.version.outputs.VERSION }}
            Скачайте APK ниже и установите на телефон.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}